<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    DDE 控制中心「环境变量」模块图标 —— 浅色主题适配版。
    与通用版（environment_icon.svg）构图一致，仅配色改为低饱和：
    底色用柔和的蓝灰渐变，条目/圆点用钢蓝色，避免在高饱和蓝底于浅色背景上产生刺眼对比。
  -->
  <defs>
    <linearGradient id="ddeEnvLight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EAF0F8"/>
      <stop offset="1" stop-color="#D2DEEE"/>
    </linearGradient>
  </defs>

  <!-- 面板（设置窗口），低饱和底色 + 细描边保证浅色背景上仍有轮廓 -->
  <rect x="7" y="8" width="40" height="46" rx="10" fill="url(#ddeEnvLight)"
        stroke="#B9C8DE" stroke-width="1"/>

  <!-- 窗口顶部：三个圆点 + 分隔线 -->
  <g fill="#5B7DA6">
    <circle cx="14" cy="16.5" r="2.1" opacity="0.9"/>
    <circle cx="20" cy="16.5" r="2.1" opacity="0.6"/>
    <circle cx="26" cy="16.5" r="2.1" opacity="0.4"/>
    <rect x="7" y="22" width="40" height="1.6" opacity="0.25"/>
  </g>

  <!-- 三行 KEY=VALUE：key=深钢蓝，value=浅钢蓝，中间留白隐含等号 -->
  <g fill="#5B7DA6">
    <rect x="13" y="27" width="9"  height="4" rx="2" opacity="0.95"/>
    <rect x="25" y="27" width="16" height="4" rx="2" opacity="0.5"/>

    <rect x="13" y="36" width="13" height="4" rx="2" opacity="0.95"/>
    <rect x="29" y="36" width="12" height="4" rx="2" opacity="0.5"/>

    <rect x="13" y="45" width="7"  height="4" rx="2" opacity="0.95"/>
    <rect x="23" y="45" width="18" height="4" rx="2" opacity="0.5"/>
  </g>
</svg>
