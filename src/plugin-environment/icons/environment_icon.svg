<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    DDE 控制中心「环境变量」模块图标。
    风格对齐控制中心「系统 - 常用」下其它模块图标：扁平、大圆角、单色/双色调的
    实心彩色象形图标（deepin 蓝 + 白色符号），不使用细线描边。
    设计：一个设置窗口面板，内含三行 KEY=VALUE 变量条目（白实心=key，半透明白=value）。
  -->
  <defs>
    <linearGradient id="ddeEnvBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3EA9FF"/>
      <stop offset="1" stop-color="#0A63EE"/>
    </linearGradient>
  </defs>

  <!-- 面板（设置窗口） -->
  <rect x="7" y="8" width="40" height="46" rx="10" fill="url(#ddeEnvBlue)"/>

  <!-- 窗口顶部：三个圆点 + 分隔线，呼应「面板/窗口」语义 -->
  <g fill="#FFFFFF">
    <circle cx="14" cy="16.5" r="2.1" opacity="0.9"/>
    <circle cx="20" cy="16.5" r="2.1" opacity="0.65"/>
    <circle cx="26" cy="16.5" r="2.1" opacity="0.4"/>
    <rect x="7" y="22" width="40" height="1.6" opacity="0.28"/>
  </g>

  <!-- 三行 KEY=VALUE：key=实心白，value=半透明白，中间留白隐含等号 -->
  <g fill="#FFFFFF">
    <rect x="13" y="27" width="9"  height="4" rx="2" opacity="0.95"/>
    <rect x="25" y="27" width="16" height="4" rx="2" opacity="0.5"/>

    <rect x="13" y="36" width="13" height="4" rx="2" opacity="0.95"/>
    <rect x="29" y="36" width="12" height="4" rx="2" opacity="0.5"/>

    <rect x="13" y="45" width="7"  height="4" rx="2" opacity="0.95"/>
    <rect x="23" y="45" width="18" height="4" rx="2" opacity="0.5"/>
  </g>
</svg>
